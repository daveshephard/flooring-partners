name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4.2.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Django system check
      working-directory: src
      env:
        DJANGO_DEBUG: "True"
        DJANGO_SECRET_KEY: "ci-only-secret-key"
      run: python manage.py check

    - name: Run migrations
      working-directory: src
      env:
        DJANGO_DEBUG: "True"
        DJANGO_SECRET_KEY: "ci-only-secret-key"
      run: python manage.py migrate --no-input

    - name: Run tests
      working-directory: src
      env:
        DJANGO_DEBUG: "True"
        DJANGO_SECRET_KEY: "ci-only-secret-key"
      run: python manage.py test

    # The browser modules have no build step and no npm dependencies — plain ES
    # modules run directly under node. metrics.parity.mjs is what keeps the
    # client-side rollups from drifting away from tree_builder.py.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    # Globbed rather than listed one per step: the suites were named individually
    # and a newly added one simply never ran here. Each script prints its own
    # name, so the log stays just as readable, and `bash -e` fails the step on the
    # first non-zero exit.
    - name: Browser module tests
      run: |
        for f in src/static/org_view/js/__tests__/*.mjs; do
          echo "── $f"
          node "$f"
        done
