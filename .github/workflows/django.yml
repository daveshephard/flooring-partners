name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4.2.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Django system check
      working-directory: src
      env:
        DJANGO_DEBUG: "True"
        DJANGO_SECRET_KEY: "ci-only-secret-key"
      run: python manage.py check

    - name: Run migrations
      working-directory: src
      env:
        DJANGO_DEBUG: "True"
        DJANGO_SECRET_KEY: "ci-only-secret-key"
      run: python manage.py migrate --no-input

    - name: Run tests
      working-directory: src
      env:
        DJANGO_DEBUG: "True"
        DJANGO_SECRET_KEY: "ci-only-secret-key"
      run: python manage.py test

    # The browser modules have no build step and no npm dependencies — plain ES
    # modules run directly under node. metrics.parity.mjs is what keeps the
    # client-side rollups from drifting away from tree_builder.py.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Client/server metric parity
      run: node src/static/org_view/js/__tests__/metrics.parity.mjs

    - name: Drag + changeset logic
      run: node src/static/org_view/js/__tests__/drag.logic.mjs
